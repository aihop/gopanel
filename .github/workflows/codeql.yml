name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周扫一次：新公布的规则能覆盖到没有改动的旧代码。
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # 面板本体、特权助手和宿主机代理是三个独立模块，
      # autobuild 只会构建根模块，另外两个要显式带上，否则特权代码根本没被扫到。
      - name: Build privileged modules
        if: matrix.language == 'go'
        run: |
          go build ./...
          (cd gpc && go build ./...)
          (cd gp-agent && go build ./...)

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
