name: SBOM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the SBOM to / 附加 SBOM 的发布标签"
        required: true

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # 源码级 SBOM：一次扫描覆盖三个 Go 模块、前端 npm 和 Flutter pub 的依赖清单。
      # 用 CycloneDX 是因为漏洞库和多数扫描器都直接吃这个格式。
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: gopanel-sbom.cyclonedx.json
          output-file: gopanel-sbom.cyclonedx.json

      - uses: actions/upload-artifact@v4
        with:
          name: gopanel-sbom
          path: gopanel-sbom.cyclonedx.json
          retention-days: 90

      - name: Attach SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: gh release upload "${TAG}" gopanel-sbom.cyclonedx.json --clobber
