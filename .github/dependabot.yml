version: 2
updates:
  # 三个 Go 模块各自独立，漏掉哪个都意味着那部分依赖不再更新。
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /gpc
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: gomod
    directory: /gp-agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # 前端依赖数量大，补丁级逐条开 PR 会淹掉列表。
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
